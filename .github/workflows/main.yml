name: CI

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lib-site-build:
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup

      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build


  lib-build:
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup

      - run: pnpm install --frozen-lockfile
      - run: pnpm lib:build
      - run: pnpm yjs-lib:build

  lib-test:
    name: lib-test (mobx${{ matrix.mobx-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mobx-version:
          - 6
          - 5
          - 4

    steps:
      - uses: ./.github/actions/setup

      - run: pnpm install --frozen-lockfile
      - run: pnpm lib:test:ci
        env:
          MOBX_VERSION: ${{ matrix.mobx-version }}
      - run: pnpm yjs-lib:test:ci
        env:
          MOBX_VERSION: ${{ matrix.mobx-version }}

      - uses: codecov/codecov-action@v5
        name: Upload codecov report
        if: matrix.mobx-version == '6'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./packages/mobx-bonsai/coverage
          fail_ci_if_error: true

  benchmark-build:
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup

      - run: pnpm install --frozen-lockfile
      - run: pnpm lib:build
      - run: pnpm build
        working-directory: ./apps/benchmark
